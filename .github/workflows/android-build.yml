name: RemoteFlow Android Build
on:
  push:
    branches:
      - main
      - master
    paths:
      - app/**
      - gradle/**
      - gradle.properties
      - settings.gradle.kts
      - build.gradle.kts
      - .github/workflows/android-build.yml
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build-android:
    runs-on: ubuntu-latest
    name: Build signed Android APK
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute app version
        shell: bash
        run: |
          echo "VERSION_CODE=$((20000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Detect Android release signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"
            printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > my-upload-key.jks
            test -s my-upload-key.jks
            keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" >/dev/null
            echo "Clé de release disponible."
          else
            echo "HAS_RELEASE_KEY=false" >> "$GITHUB_ENV"
            echo "::warning::Clé de release absente : une APK debug installable sera publiée."
          fi

      - name: Prepare debug keystore
        if: env.HAS_RELEASE_KEY != 'true'
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=RemoteFlow Debug,O=RemoteFlow,C=NE"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug installable APK
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: ./gradlew assembleDebug

      - name: Assemble signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: ./gradlew assembleRelease

      - name: Prepare installable APK
        shell: bash
        run: |
          mkdir -p release-apks
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            test -s app/build/outputs/apk/release/app-release.apk
            "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
            cp app/build/outputs/apk/release/app-release.apk "release-apks/RemoteFlow-v$VERSION_NAME-signed.apk"
          else
            test -s app/build/outputs/apk/debug/app-debug.apk
            "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
            cp app/build/outputs/apk/debug/app-debug.apk "release-apks/RemoteFlow-v$VERSION_NAME-debug-installable.apk"
          fi
          sha256sum release-apks/*.apk | tee release-apks/SHA256SUMS.txt

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteFlow-Android-signed
          path: release-apks/*

      - name: Prepare release tag
        shell: bash
        run: echo "TAG=v1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Create tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "RemoteFlow Android $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: RemoteFlow Android ${{ env.TAG }}
          generate_release_notes: true
          files: release-apks/*
